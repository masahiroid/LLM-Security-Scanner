name: Publish Extension to VS Code Marketplace

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Check publishing credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$VSCE_PAT" ] && { [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; }; then
            echo 'Error: Configure Azure federated identity variables (AZURE_CLIENT_ID & AZURE_TENANT_ID) or VSCE_PAT secret.'
            exit 1
          fi

      - name: Package VSIX
        run: npm run package:extension

      - name: Sign in with federated Azure identity
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          VSIX_PATH=$(ls packages/vscode/*.vsix | sort -V | tail -n 1)
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
            npx vsce publish --packagePath "$VSIX_PATH" --azure-credential
          else
            npx vsce publish --packagePath "$VSIX_PATH"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
